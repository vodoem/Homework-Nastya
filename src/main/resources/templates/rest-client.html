<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>REST-клиент</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
        }

        select, button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #1e40af;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .history-item {
            border: 1px solid #e5e7eb;
            padding: 12px;
            border-radius: 8px;
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            background: #e0f2fe;
            color: #1d4ed8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>REST-клиент для форматирования</h1>
    <div class="card">
        <form th:action="@{/secure/rest-client}" method="post" th:object="${textForFormatingDTO}">
            <label for="text">Текст</label>
            <textarea id="text" th:field="*{text}" placeholder="Введите текст для форматирования"></textarea>
            <div class="error" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></div>

            <div style="margin: 10px 0;">
                <label for="format">Формат</label>
                <select id="format" th:field="*{format}">
                    <option value="" disabled selected>Выберите формат</option>
                    <option th:each="format : ${formats}"
                            th:value="${format.id}"
                            th:text="${format.formatType}">
                    </option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('format')}" th:errors="*{format}"></div>
            </div>

            <button type="submit">Отправить через REST</button>
        </form>
    </div>

    <div class="card" th:if="${formattedResult}">
        <h2>Результат форматирования</h2>
        <div class="badge" th:text="${formattedResult.formatType}"></div>
        <p><strong>Исходный текст:</strong></p>
        <p th:text="${formattedResult.originalText}"></p>
        <p><strong>Форматированный текст:</strong></p>
        <p th:text="${formattedResult.formattedText}"></p>
    </div>

    <div class="card">
        <h2>История (REST)</h2>
        <div class="history-grid">
            <div class="history-item" th:each="item : ${history}">
                <div class="badge" th:text="${item.formatType}"></div>
                <div><strong>Дата:</strong> <span th:text="${item.createdAt}"></span></div>
                <div><strong>Пользователь:</strong> <span th:text="${item.userLogin}"></span></div>
                <div><strong>Исходный текст:</strong></div>
                <p th:text="${item.originalText}"></p>
                <div><strong>Формат:</strong></div>
                <p th:text="${item.formattedText}"></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
