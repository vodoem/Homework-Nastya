<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .register-card {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .btn-block {
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="register-card">
        <h2 class="text-center mb-4">Вход в систему</h2>

       <!-- &lt;!&ndash; Ошибки &ndash;&gt;
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${param.registered}" class="alert alert-success" role="alert">
            Регистрация успешна! Теперь войдите в систему.
        </div>-->

        <!-- Форма -->
        <form th:action="@{/auth/login}" th:object="${user}" method="post">

            <!-- Логин -->
            <div class="mb-3">
                <label for="login" class="form-label">Логин</label>
                <input type="text"
                       class="form-control"
                       id="login"
                       th:field="*{login}"
                       placeholder="Введите логин"
                       required>
                <div th:if="${#fields.hasErrors('login')}" class="text-danger small mt-1">
                    <span th:errors="*{login}"></span>
                </div>
            </div>

            <!-- Пароль -->
            <div class="mb-4">
                <label for="password" class="form-label">Пароль</label>
                <input type="password"
                       class="form-control"
                       id="password"
                       th:field="*{password}"
                       placeholder="Введите пароль"
                       required>
                <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1">
                    <span th:errors="*{password}"></span>
                </div>
            </div>

            <!-- Кнопки -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-block">
                    Войти в систему
                </button>
                <a th:href="@{/auth/registration}" class="btn btn-outline-secondary btn-block">
                    Назад к регистрации
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
